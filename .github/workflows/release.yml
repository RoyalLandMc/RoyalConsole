name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
          elif git ls-remote --exit-code --tags origin "v$v" >/dev/null; then
            echo "v$v already exists. Bump version in package.json first."; exit 1
          fi
          echo "name=v$v" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          t=${{ steps.tag.outputs.name }}
          gh release create "$t" dist/*.exe \
            --target "$GITHUB_SHA" \
            --title "RoyalConsole ${t#v}" \
            --generate-notes
