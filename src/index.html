<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>RoyalConsole</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><button id="tside" class="icon" title="Show or hide servers">☰</button><b>RoyalConsole</b><span class="muted">Ctrl+1..9 switch tab</span><button id="bc" style="margin-left:auto">Broadcast</button><button id="tinfo" class="icon" title="Show or hide details">▤</button></header>
<main>
  <aside id="side"><div class="sbar"><input id="q" placeholder="Search consoles"><button id="sort" class="icon" title="Sort">A-Z</button></div><div id="tree"></div></aside>
  <div class="split" data-for="side"></div>
  <section id="center">
    <div id="tabs"></div>
    <div id="terms"><div id="empty" class="muted">Pick a console on the left</div></div>
  </section>
  <div class="split" data-for="info"></div>
  <aside id="info"></aside>
</main>
<footer id="foot"></footer>
<div id="modal" hidden></div>
<div id="toasts"></div>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="renderer.js"></script>
</body>
</html>
